name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Django unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python core/manage.py migrate --noinput

      - name: Run test suite
        run: python core/manage.py test

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gdsai-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cat <<'EOF' > .env
          DJANGO_SECRET_KEY=ci-test-secret-key
          DJANGO_DEBUG=True
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
          PUBLIC_BASE_URL=http://127.0.0.1:8000
          BREVO_API_KEY=
          BREVO_SENDER_EMAIL=noreply@example.com
          BREVO_SENDER_NAME=CI Test
          DB_ENGINE=django.db.backends.postgresql
          DB_NAME=events_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=db
          DB_PORT=5432
          POSTGRES_DB=events_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          EOF

      - name: Start database service
        run: docker compose up -d db

      - name: Wait for database to accept connections
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U postgres > /dev/null 2>&1; then
              echo "Database is ready"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "Database did not become ready in time"
          docker compose logs db
          exit 1

      - name: Run migrations inside a one-off web container
        run: docker compose run --rm web python core/manage.py migrate --noinput

      - name: Start web service
        run: docker compose up -d --build web

      - name: Wait for web service to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ -o /dev/null; then
              echo "Web service is up"
              exit 0
            fi
            echo "Waiting for web service... ($i/30)"
            sleep 2
          done
          echo "Web service did not become healthy in time"
          docker compose logs web
          exit 1

      - name: Run test suite inside the running container
        run: docker compose exec -T web python core/manage.py test

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

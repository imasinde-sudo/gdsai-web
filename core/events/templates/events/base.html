{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Events Management System - Browse schedules, speakers, and events.">
  <title>{% block title %}Events Management System{% endblock %}</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

  <!-- Premium Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="{% url 'events:landing_page' %}" class="navbar-logo" id="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        EventHub
      </a>
      <ul class="navbar-links">
        <li>
          <a href="{% url 'events:landing_page' %}" class="navbar-link" id="nav-home">Home</a>
        </li>
        <li>
          <a href="{% url 'events:event_list' %}" class="navbar-link" id="nav-events">Events</a>
        </li>
        <li>
          <a href="{% url 'events:admin_dashboard' %}" class="navbar-link" id="nav-dashboard">Dashboard</a>
        </li>
        <li>
          <a href="/admin/" class="navbar-link" id="nav-admin" target="_blank">Admin Dashboard</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="main-content">
    {% block content %}
    {% endblock %}
  </main>

  <!-- Premium Footer -->
  <footer class="footer">
    <div class="footer-container">
      <div>&copy; 2026 EventHub Management. All rights reserved.</div>
      <div>Designed with premium glassmorphic interfaces.</div>
    </div>
  </footer>

</body>
</html>

$kind: http-request
name: Refresh Token
description: |-
  Issues a new JWT access token using a valid refresh token. Use this when the access token has expired (lifetime: 60 minutes).

  **Request Body:**
  | Field | Type | Required | Description |
  |---|---|---|---|
  | refresh | string | âœ… | A valid, non-blacklisted refresh token |

  **Success Response (200 OK):**
  ```json
  {
    "access": "<new_jwt_access_token>"
  }
  ```

  **Error Responses:**
  - `401 Unauthorized` â€” Refresh token is expired, invalid, or blacklisted

  > âš™ï¸ On success, `access_token` is automatically updated in the active environment.
method: POST
url: '{{base_url}}/api/v1/auth/refresh/'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refresh": "{{refresh_token}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has access field", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("access");
      });

      pm.test("Access token is a non-empty string", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.access).to.be.a("string").and.to.have.length.above(0);
      });

      pm.test("Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      var jsonData = pm.response.json();
      if (jsonData.access) {
          pm.environment.set("access_token", jsonData.access);
      }

services:
  - type: web
    name: gdsai-web
    env: python
    plan: starter
    buildCommand: "bash ./build.sh"
    startCommand: "python core/manage.py migrate && python core/manage.py setup_auth && gunicorn --chdir core core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: gdsai-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: "https://gdsai-web.onrender.com"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "@iLabAfrica Centre"

databases:
  - name: gdsai-db
    plan: free
    databaseName: gdsai_db
    user: gdsai_user
